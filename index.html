<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{--ink:#16213e;--paper:#f3f5f9;--line:#d5dbe7;--navy:#16213e;--blue:#2f5bea;--mark:#ffe14d;--err:#b42318;
  --ui:'Bricolage Grotesque',system-ui,sans-serif;--read:'Source Serif 4',Georgia,serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;font-family:var(--ui);color:var(--ink);background:var(--paper)}
aside{width:270px;flex:none;background:var(--navy);color:#dfe5f5;padding:20px 16px;overflow-y:auto}
aside h1{font-size:22px;margin:0 0 16px;color:#fff}
aside h2{font-size:14px;font-weight:600;margin:24px 0 8px;color:#9fb0d8}
aside ul{list-style:none;margin:0;padding:0}
aside li{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:14px}
aside li:hover,aside li.on{background:#24325a}
aside li span,aside li a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:inherit;text-decoration:none}
aside li small{color:#9fb0d8}
aside li button{background:none;border:0;color:#9fb0d8;font-size:18px;cursor:pointer}
#new{width:100%;padding:10px;border:0;border-radius:6px;background:var(--mark);color:var(--ink);font:600 15px var(--ui);cursor:pointer}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff}
#modes{display:flex;flex-wrap:wrap;gap:4px}
#modes button{border:0;background:none;padding:6px 10px;font:600 15px var(--ui);color:var(--ink);cursor:pointer;border-radius:4px}
#modes button.on{background:linear-gradient(transparent 55%,var(--mark) 55%)}
select,.up{font:500 14px var(--ui);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
#doc{font-size:13px;color:#4b5a80}
#log{flex:1;overflow-y:auto;padding:24px 20px;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px;background-color:var(--paper)}
.msg{max-width:760px;margin:0 auto 18px;padding:14px 18px;border-radius:10px;line-height:1.6}
.user{background:var(--navy);color:#fff;margin-right:0;max-width:560px;margin-left:auto;font-size:15px;white-space:pre-wrap}
.assistant{background:#fff;border:1px solid var(--line);font:17px/1.65 var(--read)}
.assistant h1,.assistant h2,.assistant h3{font-family:var(--ui);line-height:1.25}
.assistant pre{overflow-x:auto;background:var(--paper);padding:10px;border-radius:6px}
.assistant table{border-collapse:collapse;display:block;overflow-x:auto}
.assistant td,.assistant th{border:1px solid var(--line);padding:4px 8px}
.loading{color:#4b5a80;font-style:italic}
.error{background:#fef3f2;border:1px solid #fda29b;color:var(--err);font:500 15px var(--ui)}
.ex{margin-top:10px;font:500 13px var(--ui)}.ex a{color:var(--blue);margin-right:12px}
.hint{max-width:560px;margin:60px auto;text-align:center;font:17px/1.6 var(--read);color:#4b5a80}
.bar{display:flex;gap:10px;padding:14px 20px;background:#fff;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;padding:10px 12px;font:16px var(--ui);border:1px solid var(--line);border-radius:8px}
#send{padding:0 22px;border:0;border-radius:8px;background:var(--blue);color:#fff;font:600 15px var(--ui);cursor:pointer}
#send:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(max-width:800px){aside{display:none}}
</style>
</head>
<body>
<aside>
  <h1>StudyBuddy</h1>
  <button id="new">New conversation</button>
  <h2>Conversations</h2><ul id="convs"></ul>
  <h2>Saved notes, quizzes and plans</h2><ul id="saved"></ul>
</aside>
<main>
  <header>
    <div id="modes"></div>
    <select id="level" aria-label="Difficulty"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select>
    <label class="up">Upload PDF or text<input type="file" id="file" accept=".pdf,.txt,.md" hidden></label>
    <span id="doc"></span>
  </header>
  <section id="log" aria-live="polite"></section>
  <div class="bar">
    <textarea id="in" rows="2"></textarea>
    <button id="send">Send</button>
  </div>
</main>
<script>
const MODES={
  explain:['Explain','What do you want to understand? e.g. How does photosynthesis work?'],
  notes:['Study notes','Topic to summarise, e.g. Causes of the French Revolution'],
  quiz:['Quiz','Topic for a 5-question quiz, e.g. Newton\'s laws of motion'],
  plan:['Study plan','Goal and time, e.g. Learn SQL in 3 weeks, 1 hour a day'],
  ask:['Ask my file','Ask a question about the file you uploaded']};
const $=s=>document.querySelector(s);
let cid=null,mode='explain',busy=false;

async function api(path,opt={}){
  const form=opt.body instanceof FormData;
  const r=await fetch('/api'+path,{...opt,headers:form?{}:{'Content-Type':'application/json'}});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok)throw new Error(d.error||'Request failed ('+r.status+')');
  return d}

function add(role,text,m={}){
  const d=document.createElement('div');d.className='msg '+role;
  if(role==='assistant')d.innerHTML=DOMPurify.sanitize(marked.parse(text));else d.textContent=text;
  if(m.saved_id){
    const x=document.createElement('div');x.className='ex';
    x.innerHTML=`<a href="/api/saved/${m.saved_id}/export?format=md">Export .md</a><a href="/api/saved/${m.saved_id}/export?format=txt">Export .txt</a>`;
    d.append(x)}
  $('#log').append(d);d.scrollIntoView({block:'end'});return d}

function setMode(k){
  mode=k;$('#in').placeholder=MODES[k][1];
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.k===k))}

function reset(){
  cid=null;$('#doc').textContent='';$('#log').innerHTML=
   '<div class="hint">Pick a mode above, choose your level, and type a topic. Upload a PDF or text file to ask questions about it.</div>'}

async function loadConvs(){
  const list=await api('/conversations');const ul=$('#convs');ul.innerHTML='';
  list.forEach(c=>{
    const li=document.createElement('li');if(c.id===cid)li.className='on';
    const s=document.createElement('span');s.textContent=c.title;s.onclick=()=>openConv(c.id);
    const b=document.createElement('button');b.textContent='×';b.title='Delete conversation';
    b.onclick=async()=>{if(!confirm('Delete this conversation?'))return;
      await api('/conversations/'+c.id,{method:'DELETE'});if(cid===c.id)reset();loadConvs();loadSaved()};
    li.append(s,b);ul.append(li)})}

async function loadSaved(){
  const list=await api('/saved');const ul=$('#saved');ul.innerHTML='';
  list.forEach(i=>{
    const li=document.createElement('li');
    const a=document.createElement('a');a.href=`/api/saved/${i.id}/export?format=md`;a.textContent=i.title;a.title='Download as Markdown';
    const k=document.createElement('small');k.textContent=i.kind;li.append(a,k);ul.append(li)})}

async function openConv(id){
  try{
    const d=await api('/conversations/'+id);cid=id;$('#log').innerHTML='';
    d.messages.forEach(m=>add(m.role,m.content,m));
    $('#doc').textContent=d.document?'File: '+d.document:'';loadConvs()
  }catch(e){add('error',e.message)}}

async function ensureConv(){if(!cid){cid=(await api('/conversations',{method:'POST',body:'{}'})).id}}

async function send(){
  const t=$('#in').value.trim();if(!t||busy)return;
  busy=true;$('#send').disabled=true;
  try{
    await ensureConv();
    if($('.hint'))$('#log').innerHTML='';
    add('user',t);$('#in').value='';
    const w=add('assistant','');w.classList.add('loading');w.textContent='Thinking…';
    try{
      const r=await api(`/conversations/${cid}/chat`,{method:'POST',body:JSON.stringify({message:t,mode,level:$('#level').value})});
      w.remove();add('assistant',r.content,r);loadConvs();loadSaved()
    }catch(e){w.remove();add('error',e.message);$('#in').value=t}
  }catch(e){add('error',e.message)}
  busy=false;$('#send').disabled=false;$('#in').focus()}

$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    await ensureConv();const fd=new FormData();fd.append('file',f);
    $('#doc').textContent='Reading '+f.name+'…';
    const r=await api(`/conversations/${cid}/upload`,{method:'POST',body:fd});
    $('#doc').textContent='File: '+r.filename;setMode('ask');loadConvs()
  }catch(err){$('#doc').textContent='';if($('.hint'))$('#log').innerHTML='';add('error',err.message)}
  e.target.value=''};

$('#send').onclick=send;
$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('#new').onclick=()=>{reset();loadConvs()};
Object.entries(MODES).forEach(([k,[label]])=>{
  const b=document.createElement('button');b.dataset.k=k;b.textContent=label;b.onclick=()=>setMode(k);$('#modes').append(b)});
setMode('explain');reset();loadConvs();loadSaved();
</script>
</body>
</html>
